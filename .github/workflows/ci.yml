name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  skill-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install & Build
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          icon_size: ""
          per_row: ""
          out_path: ""
          tag: TEST
          filename: TEST.md

      - name: Print Output
        id: print-output
        run: echo "${{ steps.test-action.outputs.list }}"
